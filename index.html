<script>
async function processVideo() {
    const inputUrl = document.getElementById('targetUrl').value.trim();
    const statusDiv = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const finalDownloadBtn = document.getElementById('finalDownloadBtn');

    if (!inputUrl) {
        statusDiv.innerHTML = "<span style='color: #ff4757;'>Isi URL-nya dulu bah!</span>";
        return;
    }

    statusDiv.innerHTML = "<span style='color: #ffa502;'>Mengalihkan ke server pengunduh pihak ketiga...</span>";
    resultArea.style.display = "none";

    try {
        // Ekstraksi langsung menggunakan trik URL parser pihak ketiga yang valid
        statusDiv.innerHTML = "<span style='color: #2ed573;'>Membuka halaman unduhan...</span>";
        resultArea.style.display = "block";
        
        // Memperbaiki fungsi tombol simpan agar link-nya benar secara sintaksis
        finalDownloadBtn.onclick = function(e) {
            e.preventDefault();
            
            // Pihak ketiga alternatif 1: 9xBuddy versi .com (Terbukti ampuh tembus segala web)
            const targetBypassUrl = "https://9xbuddy.com" + encodeURIComponent(inputUrl);
            
            // Jendela baru akan langsung terbuka membawa URL video Anda
            window.open(targetBypassUrl, '_blank');
        };

    } catch (error) {
        console.error(error);
        statusDiv.innerHTML = "<span style='color: #ff4757;'>Gagal memproses otomatis.</span>";
    }
}
</script>
