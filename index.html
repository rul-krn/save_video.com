<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murni HTML Video Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .download-btn {
            display: block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Murni HTML Downloader</h2>
    <p>Klik tombol di bawah untuk langsung mengunduh video:</p>

    <!-- Ganti href dengan URL video MP4 asli Anda -->
    <a href="https://w3schools.com" download="video_1.mp4" class="download-btn">
        Unduh Video 1 (MP4)
    </a>

    <a href="https://w3schools.com" download="video_2.mp4" class="download-btn">
        Unduh Video 2 (MP4)
    </a>
</div>

</body>
</html>
